<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 384" role="img" aria-label="The Fool">
  <defs>
    <linearGradient id="f-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c68e"/>
      <stop offset="1" stop-color="#b8955a"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3dca6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f3dca6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="f-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <path d="M0 3h6" stroke="#30253b" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <clipPath id="f-scene"><rect x="18" y="58" width="204" height="272" rx="6"/></clipPath>
  </defs>
  <rect x="1" y="1" width="238" height="382" rx="14" fill="#f6f0e7" stroke="url(#f-gold)" stroke-width="3"/>
  <rect x="12" y="12" width="216" height="360" rx="8" fill="none" stroke="#ac9bcb" stroke-width="1" opacity="0.7"/>
  <text x="120" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b8955a">0</text>
  <g clip-path="url(#f-scene)">
    <!-- sky, pale and warm at the horizon -->
    <rect x="18" y="58" width="204" height="272" fill="#f3e8d3"/>
    <rect x="18" y="58" width="204" height="120" fill="#ece0cf" opacity="0.5"/>
    <!-- the high sun, top right third -->
    <circle cx="196" cy="84" r="44" fill="url(#f-glow)"/>
    <circle cx="196" cy="84" r="17" fill="#f3dca6" stroke="#d5b47a" stroke-width="1.2"/>
    <g stroke="#d5b47a" stroke-width="1" opacity="0.7" stroke-linecap="round">
      <path d="M196 58v-6 M196 110v6 M170 84h-6 M222 84h6 M178 66l-4-4 M214 102l4 4 M214 66l4-4 M178 102l-4 4"/>
    </g>
    <!-- distant mountains, violet, two ranges -->
    <path d="M18 216 L48 172 L70 196 L98 150 L126 190 L150 168 L178 200 L200 184 L222 206 V236 H18 Z" fill="#cbbad6"/>
    <path d="M18 230 L40 208 L62 222 L84 202 L104 224 L132 206 L156 226 L184 210 L222 228 V250 H18 Z" fill="#b8a4c7"/>
    <path d="M98 150 L104 160 L92 162 Z M150 168 L156 178 L144 178 Z" fill="#f6f0e7" opacity="0.8"/>
    <!-- valley haze -->
    <rect x="18" y="238" width="204" height="30" fill="#e7dbc9" opacity="0.7"/>
    <!-- the cliff: a solid mass from the left, edge under the figure's front foot -->
    <path d="M18 330 V232 C40 228 60 226 76 222 C96 216 112 220 128 232 C134 238 136 246 132 254 C124 268 104 282 92 300 C82 316 74 326 70 330 Z" fill="#c9b48f"/>
    <path d="M18 330 V232 C40 228 60 226 76 222 C96 216 112 220 128 232 C134 238 136 246 132 254 C124 268 104 282 92 300 C82 316 74 326 70 330 Z" fill="url(#f-hatch)"/>
    <path d="M128 232 C134 238 136 246 132 254 C124 268 104 282 92 300" fill="none" stroke="#8c7756" stroke-width="2"/>
    <path d="M18 232 C40 228 60 226 76 222 C96 216 112 220 128 232" fill="none" stroke="#8c7756" stroke-width="2"/>
    <path d="M30 262c14-4 24-12 34-22 M44 292c12-8 20-18 30-30 M26 312c10-6 18-14 26-24" fill="none" stroke="#8c7756" stroke-width="1" opacity="0.6"/>
    <!-- foreground ground below the cliff, darker -->
    <path d="M18 330 h204 v0" fill="none"/>
    <path d="M70 330 C80 322 96 300 108 288 C124 272 140 262 160 260 C182 258 204 266 222 280 V330 Z" fill="#b39b74"/>
    <!-- cast shadow under the figure -->
    <ellipse cx="104" cy="224" rx="20" ry="4" fill="#30253b" opacity="0.18"/>
    <!-- THE FIGURE: about 108 px tall, head ~15 px, three-quarter turn to the right, weight on back foot, front foot at the edge -->
    <g stroke="#30253b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- back leg (planted), hose in ink-soft -->
      <path d="M92 176 C90 190 88 204 88 218 L96 220 C97 206 100 192 102 178 Z" fill="#4a3a5c"/>
      <path d="M84 218 L96 216 L98 224 L84 226 Z" fill="#30253b"/>
      <!-- front leg, stepping out over the edge -->
      <path d="M106 176 C112 188 118 200 124 212 L132 208 C126 196 120 184 116 174 Z" fill="#4a3a5c"/>
      <path d="M122 212 L134 206 L139 213 L128 220 Z" fill="#30253b"/>
      <!-- tunic: a belted shape, a scalloped hem -->
      <path d="M92 130 C88 140 86 156 88 178 C96 182 112 182 120 178 C122 156 118 140 112 130 Z" fill="#d8b8d8"/>
      <path d="M88 178 c6 4 12 6 16 6 c6 0 12-2 16-6" fill="none" stroke="#30253b" stroke-width="1.4" opacity="0.6"/>
      <path d="M90 156 h30" fill="none" stroke="#b8955a" stroke-width="2.4"/>
      <path d="M100 136 c2 8 2 16 0 22" fill="none" stroke="#30253b" stroke-width="1" opacity="0.5"/>
      <!-- sleeves and arms -->
      <path d="M112 134 L134 116 L152 108" fill="none"/>
      <path d="M92 134 L82 150 L76 158" fill="none"/>
      <!-- hands: small filled ovals -->
      <ellipse cx="154" cy="107" rx="4" ry="3" fill="#f6f0e7"/>
      <ellipse cx="75" cy="160" rx="4" ry="3" fill="#f6f0e7"/>
      <!-- staff with the bundle, over the shoulder -->
      <path d="M150 108 L178 92" fill="none" stroke="#8c7756" stroke-width="2.6"/>
      <path d="M172 96 c6-8 18-8 22 0 c3 8-4 15-12 14 c-8-1-13-8-10-14 z" fill="#e9c98a"/>
      <path d="M178 92 l4 8" fill="none" stroke="#8c7756" stroke-width="1.4"/>
      <!-- the white rose in the trailing hand -->
      <circle cx="72" cy="160" r="5" fill="#f6f0e7" stroke="#b8955a" stroke-width="1.6"/>
      <circle cx="72" cy="160" r="2" fill="none" stroke="#b8955a" stroke-width="1"/>
      <path d="M74 165 l4 10" fill="none" stroke="#4f5e48" stroke-width="1.4"/>
      <!-- neck and head, three-quarter, chin lifted to the sky -->
      <path d="M100 130 L102 122" fill="none"/>
      <path d="M96 118 c-2-10 6-16 14-14 c8 2 10 12 6 18 c-3 4-8 6-12 5 c-4-1-7-4-8-9 z" fill="#f6f0e7"/>
      <path d="M114 112 l4-3" fill="none" stroke="#30253b" stroke-width="1.2"/>
      <!-- feathered cap -->
      <path d="M92 116 c2-10 12-16 22-12 c4 2 6 4 8 6 c-10-2-22 0-30 6 z" fill="#4f5e48"/>
      <path d="M118 106 c8-10 18-12 26-10 c-8 2-14 6-18 12" fill="#4f5e48" stroke="#30253b" stroke-width="1.6"/>
    </g>
    <!-- the small white dog at the heel, leaping -->
    <g stroke="#30253b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 214 c4-8 12-10 18-6 c6 4 6 10 2 14 c-2 2-6 2-8 0 c-4 4-10 4-12-2 c-2-4-2-6 0-6 z" fill="#f6f0e7"/>
      <path d="M78 206 c4-3 8-2 10 2 c1 3-1 5-4 5 c-3 0-5-2-6-5 z" fill="#f6f0e7"/>
      <path d="M86 206 l4-5 M70 226 l-2 6 M80 224 l2 6 M60 212 c-4-2-6-6-4-10" fill="none"/>
      <circle cx="86" cy="208" r="1" fill="#30253b"/>
    </g>
    <!-- foreground flowers at the cliff base -->
    <g stroke="#4f5e48" stroke-width="1.2" fill="none">
      <path d="M36 314v10 M52 320v8 M78 312v12 M64 304v8"/>
    </g>
    <g fill="#f6f0e7" stroke="#b8955a" stroke-width="1">
      <circle cx="36" cy="312" r="3.2"/><circle cx="52" cy="318" r="2.6"/><circle cx="78" cy="310" r="2.8"/><circle cx="64" cy="302" r="2.4"/>
    </g>
    <!-- a few birds far off -->
    <path d="M56 108 q4-3 8 0 M62 116 q4-3 8 0" fill="none" stroke="#4a3a5c" stroke-width="1" opacity="0.6"/>
  </g>
  <rect x="18" y="58" width="204" height="272" rx="6" fill="none" stroke="#b8955a" stroke-width="1" opacity="0.8"/>
  <text x="120" y="362" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#30253b" letter-spacing="0.5">The Fool</text>
</svg>
