  <rect x="14" y="14" width="212" height="356" rx="8" fill="none" stroke="#d5b47a" stroke-width="1" opacity="0.75"/>
  <rect x="20" y="20" width="200" height="344" rx="6" fill="none" stroke="#ac9bcb" stroke-width="0.6" opacity="0.5"/>
