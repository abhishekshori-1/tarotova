<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 384" role="img" aria-label="The Tower">
  <defs>
    <linearGradient id="t-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c68e"/>
      <stop offset="1" stop-color="#b8955a"/>
    </linearGradient>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14111f"/>
      <stop offset="0.65" stop-color="#3a2f52"/>
      <stop offset="1" stop-color="#5a4a76"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3dca6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3dca6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="t-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 2.5h5" stroke="#14111f" stroke-width="0.6" opacity="0.28"/>
    </pattern>
    <clipPath id="t-scene"><rect x="18" y="58" width="204" height="272" rx="6"/></clipPath>
  </defs>
  <rect x="1" y="1" width="238" height="382" rx="14" fill="#f6f0e7" stroke="url(#t-gold)" stroke-width="3"/>
  <rect x="12" y="12" width="216" height="360" rx="8" fill="none" stroke="#ac9bcb" stroke-width="1" opacity="0.7"/>
  <text x="120" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b8955a">XVI</text>
  <g clip-path="url(#t-scene)">
    <rect x="18" y="58" width="204" height="272" fill="url(#t-sky)"/>
    <!-- low cloud bank behind the peak -->
    <path d="M18 232 C40 218 60 226 76 218 C96 208 120 216 142 210 C166 204 190 214 222 206 V330 H18 Z" fill="#2c2440" opacity="0.8"/>
    <!-- the light: a single glow where the bolt meets the top -->
    <circle cx="128" cy="118" r="44" fill="url(#t-glow)"/>
    <!-- the peak: a solid dark mass with the tower footed into it -->
    <path d="M18 330 V286 C34 278 48 264 62 252 C80 236 100 232 120 236 C144 240 160 250 176 264 C196 282 210 296 222 302 V330 Z" fill="#1f1a2c"/>
    <path d="M18 330 V286 C34 278 48 264 62 252 C80 236 100 232 120 236 C144 240 160 250 176 264 C196 282 210 296 222 302 V330 Z" fill="url(#t-hatch)"/>
    <path d="M62 252 C80 236 100 232 120 236 C144 240 160 250 176 264" fill="none" stroke="#6a5c7c" stroke-width="1.2"/>
    <path d="M96 250 C104 246 116 244 120 244 C126 244 136 246 144 250 C138 256 128 258 120 258 C112 258 102 256 96 250 Z" fill="#f3dca6" opacity="0.14"/>
    <!-- THE TOWER: a tapered shaft with a battlemented top, three courses of masonry, footed on a plinth -->
    <path d="M92 250 L96 242 L144 242 L148 250 Z" fill="#6f6379" stroke="#30253b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M100 246 L98 140 L142 140 L140 246 Z" fill="#8f8296" stroke="#30253b" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M102 246 L100 140 L118 140 L118 246 Z" fill="#a89bb0" opacity="0.7"/>
    <path d="M118 140 L142 140 L140 246 L118 246 Z" fill="#6f6379" opacity="0.6"/>
    <!-- masonry courses -->
    <g stroke="#30253b" stroke-width="0.8" opacity="0.55" fill="none">
      <path d="M99 160h42 M99 180h42 M99 200h41 M99 220h41 M99 240h41"/>
      <path d="M120 140v20 M109 160v20 M131 160v20 M120 180v20 M109 200v20 M131 200v20 M120 220v20 M109 240v6 M131 240v6"/>
    </g>
    <!-- battlements, the top partly broken open -->
    <path d="M96 140 L96 128 L104 128 L104 134 L112 134 L112 128 L120 128 L120 134 L128 134 L128 126 L134 122 L138 130 L144 130 L144 140 Z" fill="#8f8296" stroke="#30253b" stroke-width="2" stroke-linejoin="round"/>
    <!-- windows with flames, arched -->
    <path d="M112 166 q8-12 16 0 v16 h-16 z" fill="#14111f"/>
    <path d="M112 206 q8-12 16 0 v16 h-16 z" fill="#14111f"/>
    <g fill="#f3dca6">
      <path d="M114 182 c-2-8 2-12 4-16 c1 5 4 6 5 3 c3 4 3 9 0 13 z"/>
      <path d="M114 222 c-2-8 2-12 4-16 c1 5 4 6 5 3 c3 4 3 9 0 13 z"/>
    </g>
    <g fill="#ffffff" opacity="0.8">
      <path d="M117 182 c-1-4 1-6 2-8 c1 3 2 3 3 5 c1 2 0 3-1 3 z"/>
      <path d="M117 222 c-1-4 1-6 2-8 c1 3 2 3 3 5 c1 2 0 3-1 3 z"/>
    </g>
    <!-- ONE clean bolt from the top right corner to the top of the tower -->
    <path d="M206 60 L178 96 L190 98 L156 122 L166 124 L134 126" fill="none" stroke="#f3dca6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M206 60 L178 96 L190 98 L156 122 L166 124 L134 126" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <!-- the crown, thrown clear, tumbling -->
    <g transform="rotate(-28 92 104)">
      <path d="M78 110 L82 92 L88 102 L92 86 L96 102 L102 92 L106 110 Z" fill="#e3c68e" stroke="#30253b" stroke-width="2" stroke-linejoin="round"/>
      <path d="M80 110 h24" stroke="#b8955a" stroke-width="2"/>
      <circle cx="82" cy="92" r="1.6" fill="#b8955a"/><circle cx="92" cy="86" r="1.6" fill="#b8955a"/><circle cx="102" cy="92" r="1.6" fill="#b8955a"/>
    </g>
    <!-- falling stones and embers -->
    <g fill="#a89bb0" stroke="#30253b" stroke-width="1.2" stroke-linejoin="round">
      <path d="M76 138 l9-3 l3 9 l-9 3 z"/>
      <path d="M160 150 l8-4 l4 8 l-8 4 z"/>
      <path d="M70 176 l6-2 l2 6 l-6 2 z"/>
      <path d="M156 190 l6-2 l2 6 l-6 2 z"/>
    </g>
    <g fill="#f3dca6">
      <circle cx="150" cy="134" r="1.8"/><circle cx="88" cy="150" r="1.4"/><circle cx="166" cy="172" r="1.3"/><circle cx="68" cy="196" r="1.3"/><circle cx="60" cy="140" r="1.1"/><circle cx="176" cy="204" r="1.1"/>
    </g>
    <!-- the two figures, small, in the air, limbs loose rather than flailing; filled shapes -->
    <g stroke="#f5ebdd" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="#f5ebdd">
      <!-- left figure, head down, robe streaming upward; limbs as filled shapes -->
      <g transform="rotate(-155 66 214) translate(66 214) scale(0.72) translate(-66 -214)">
        <circle cx="66" cy="199" r="4.6"/>
        <path d="M60 205 c-3 9-3 17 0 25 c4 2 8 2 12 0 c3-8 3-16 0-25 z"/>
        <path d="M60 229 l-5 11 l4 1 l5-11 z M72 229 l5 11 l-4 1 l-5-11 z"/>
        <path d="M60 208 l-8 6 l2 3 l8-6 z M72 208 l8 5 l-2 3 l-8-5 z"/>
      </g>
      <!-- right figure, turning, one arm reaching -->
      <g transform="rotate(145 172 226) translate(172 226) scale(0.72) translate(-172 -226)">
        <circle cx="172" cy="211" r="4.6"/>
        <path d="M166 217 c-3 9-3 17 0 25 c4 2 8 2 12 0 c3-8 3-16 0-25 z"/>
        <path d="M166 241 l-5 11 l4 1 l5-11 z M178 241 l5 11 l-4 1 l-5-11 z"/>
        <path d="M166 220 l-9 4 l1 3 l9-4 z M178 219 l9-5 l2 3 l-9 5 z"/>
      </g>
    </g>
    <!-- the ground line -->
    <path d="M18 330 h204" stroke="#14111f" stroke-width="1" opacity="0.5"/>
  </g>
  <rect x="18" y="58" width="204" height="272" rx="6" fill="none" stroke="#b8955a" stroke-width="1" opacity="0.8"/>
  <text x="120" y="362" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#30253b" letter-spacing="0.5">The Tower</text>
</svg>
